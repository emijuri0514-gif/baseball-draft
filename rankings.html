        本サイトの実際の適性計算式（守備・打順の得意不得意を反映したスコア）で、各ポジションの上位選手をランキングしています。<br>

  <script>
    // 本体(index.html)のgetPosScore()と全く同じ計算式。適性ボーナス／ペナルティも含めて実際の
    // ゲーム内評価と一致させるため、値は決してここだけで独自に変えない。
    function getPosScore(p, pos) {
      let score = 50;
      let bestPositions = Array.isArray(p.bestPos) ? p.bestPos : [p.bestPos];

      if (p.pStats) {
        if (pos === "先発") score = p.pStats.con * 0.4 + p.pStats.sta * 0.35 + p.pStats.pow * 0.25;
        else if (pos === "中継" || pos === "抑え") score = p.pStats.pow * 0.55 + p.pStats.con * 0.30 + p.pStats.sta * 0.15;

        if (bestPositions[0] === pos) score += 5;
        else if (bestPositions.includes(pos)) score -= 4;
        else if (pos === "先発" && !bestPositions.includes("先発")) score -= 20;
        else if (pos !== "先発" && bestPositions[0] === "先発") score -= 12;
      } else if (p.fStats) {
        const s = p.fStats;
        const bat = (s.pow + s.meet) / 2;
        if (pos === "DH") score = bat * 1.0;
        else if (pos === "捕") score = s.def * 0.5 + bat * 0.4 + s.run * 0.1;
        else if (pos === "一") score = bat * 0.8 + s.def * 0.1 + s.run * 0.1;
        else if (pos === "二" || pos === "遊") score = s.def * 0.30 + s.run * 0.20 + bat * 0.5;
        else if (pos === "三") score = bat * 0.7 + s.def * 0.2 + s.run * 0.1;
        else if (pos === "中") score = s.run * 0.4 + s.def * 0.3 + bat * 0.3;
        else if (pos === "左") score = bat * 0.7 + s.run * 0.2 + s.def * 0.1;
        else if (pos === "右") score = bat * 0.7 + s.def * 0.2 + s.run * 0.1;

        if (pos !== "DH") {
          let expandedBestPos = [];
          bestPositions.forEach(bp => {
            if (bp === "外") expandedBestPos.push("左", "中", "右");
            else expandedBestPos.push(bp);
          });

          if (expandedBestPos[0] === pos || (bestPositions[0] === "外" && ["左", "中", "右"].includes(pos))) {
            score += 5;
          } else if (expandedBestPos.includes(pos)) {
            score -= 4;
          } else {
            const isOut = ["左","中","右"].includes(pos);
            const pIsOut = expandedBestPos.some(bp => ["左","中","右"].includes(bp));
            const isIn = ["一","二","三","遊"].includes(pos);
            const pIsIn = expandedBestPos.some(bp => ["一","二","三","遊"].includes(bp));

            if (expandedBestPos[0] === "捕" && pos !== "捕") score -= 18;
            else if (pos === "捕" && !expandedBestPos.includes("捕")) score -= 30;
            else if (isOut && pIsOut) score -= 10;
            else if (isIn && pIsIn) score -= 12;
            else score -= 22;
          }
        }
      }
      return score;
    }

    const BATTER_POS = ["捕","一","二","三","遊","左","中","右","DH"];
    const PITCHER_POS = ["先発","中継","抑え"];

    function statLine(p) {
      if (p.fStats) return `ミート${p.fStats.meet} パワー${p.fStats.pow} 走力${p.fStats.run} 守備${p.fStats.def}`;
      return `球威${p.pStats.pow} 制球${p.pStats.con} スタミナ${p.pStats.sta}`;
    }

    function renderPosCard(pos, players) {
      const top5 = [...players]
        .map(p => ({ p, score: getPosScore(p, pos) }))
        .sort((a, b) => b.score - a.score)
        .slice(0, 5);
      const rows = top5.map((r, i) => `
        <li class="flex items-start gap-2 py-1.5 border-b border-gray-700 last:border-0">
          <span class="w-5 text-yellow-400 font-black text-sm shrink-0">${i + 1}</span>
          <div class="flex-1 min-w-0">
            <div class="flex items-baseline gap-2 flex-wrap">
              <span class="font-bold">${r.p.name}</span>
              <span class="text-[10px] text-gray-500 whitespace-nowrap">${r.p.team}</span>
            </div>
            <div class="text-[10px] text-gray-400">${statLine(r.p)}</div>
          </div>
        </li>
      `).join('');
      return `
        <div class="bg-gray-800 rounded-lg p-4">
          <h3 class="font-black text-yellow-400 mb-2">${pos}</h3>
          <ul>${rows}</ul>
        </div>
      `;
    }

    function init(all) {
      const batters = all.filter(p => p.fStats);
      const pitchers = all.filter(p => p.pStats);
      const cards = [
        ...BATTER_POS.map(pos => renderPosCard(pos, batters)),
        ...PITCHER_POS.map(pos => renderPosCard(pos, pitchers))
      ];
      document.getElementById('ranking-grid').innerHTML = cards.join('');
      document.getElementById('load-status').classList.add('hidden');
      document.getElementById('app').classList.remove('hidden');
    }

    // index.html本体のinitialDatabaseをfetchして常に最新の選手データと同期させる
    fetch('index.html')
      .then(r => r.text())
      .then(html => {
        const start = html.indexOf('const initialDatabase');
        const end = html.indexOf('];', start) + 2;
        if (start === -1 || end === -1) throw new Error('parse-failed');
        const src = html.slice(start, end);
        const players = new Function(src + '; return initialDatabase;')();
        init(players);
      })
      .catch(() => {
        document.getElementById('load-status').textContent = '選手データの読み込みに失敗しました。GitHub Pages等のWebサーバー経由でアクセスしてください（ファイルを直接開くと読み込めません）。';
      });
  </script>
